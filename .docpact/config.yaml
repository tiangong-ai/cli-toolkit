version: 1
layout: repo
lastReviewedAt: "2026-09-19"
lastReviewedCommit: "eea7ae0530a123ef29672420e46b8c071d8a8f90"

catalog:
  repos:
    - id: cli
      path: .
      canonicalRepo: tiangong-ai/cli-toolkit
      entryDoc: AGENTS.md
      workflowDocs:
        - docs/agents/repo-validation.md
        - docs/agents/repo-architecture.md
        - docs/agents/data-runtime-architecture.md
        - docs/agents/data-runtime-implementation-plan.md
        - README.md
      workspaceIntegrationRequired: true

repo:
  id: cli
  owner: cli

ownership:
  domains:
    - id: repo-governance-and-docs
      paths:
        include:
          - AGENTS.md
          - README.md
          - CONTRIBUTING.md
          - .github/ISSUE_TEMPLATE/**
          - .docpact/config.yaml
          - docs/agents/**
          - .github/workflows/**
      ownerRepo: cli
    - id: command-surface
      paths:
        include:
          - bin/**
          - src/main.ts
          - src/cli.ts
      ownerRepo: cli
    - id: validation-and-automation
      paths:
        include:
          - package.json
          - package-lock.json
          - .dockerignore
          - Dockerfile.clean-test
          - .nvmrc
          - .gitattributes
          - tsconfig.json
          - tsconfig.build.json
          - .prettierrc.json
          - test/**
          - scripts/**
      ownerRepo: cli
    - id: atomic-data-runtime
      paths:
        include:
          - docs/agents/data-runtime-architecture.md
          - docs/agents/data-runtime-implementation-plan.md
          - src/data/**
          - src/research/workspace/data-evidence-adapter.ts
          - test/data-*.test.ts
      ownerRepo: cli

routing:
  intents:
    issue-reporting:
      paths:
        - CONTRIBUTING.md
        - .github/ISSUE_TEMPLATE/**
        - src/cli.ts
        - test/issue-reporting.test.ts
    command-surface:
      paths:
        - bin/**
        - src/**
        - README.md
    validation-release:
      paths:
        - package.json
        - package-lock.json
        - .dockerignore
        - Dockerfile.clean-test
        - .nvmrc
        - .gitattributes
        - tsconfig.json
        - tsconfig.build.json
        - .prettierrc.json
        - test/**
        - scripts/**
        - .github/workflows/**
        - docs/agents/repo-validation.md
    repo-docs:
      paths:
        - AGENTS.md
        - README.md
        - .docpact/config.yaml
        - docs/agents/**
    data-runtime:
      paths:
        - docs/agents/data-runtime-architecture.md
        - docs/agents/data-runtime-implementation-plan.md
        - src/data/**
        - src/research/workspace/data-evidence-adapter.ts
        - test/data-*.test.ts
        - package.json
        - package-lock.json
        - tsconfig.json
        - tsconfig.build.json
        - Dockerfile.clean-test
        - .github/workflows/**

coverage:
  include:
    - CONTRIBUTING.md
    - .github/ISSUE_TEMPLATE/**
    - AGENTS.md
    - README.md
    - .docpact/config.yaml
    - docs/agents/**
    - .github/workflows/**
    - package.json
    - package-lock.json
    - .dockerignore
    - Dockerfile.clean-test
    - .nvmrc
    - .gitattributes
    - .prettierrc.json
    - tsconfig.json
    - tsconfig.build.json
    - bin/**
    - src/**
    - test/**
    - scripts/**
  exclude:
    - .git/**
    - .docpact/runs/**
    - node_modules/**
    - dist/**
    - coverage/**
    - "*.log"

docInventory:
  include:
    - CONTRIBUTING.md
    - AGENTS.md
    - README.md
    - .docpact/config.yaml
    - docs/agents/repo-validation.md
    - docs/agents/repo-architecture.md
    - docs/agents/data-runtime-architecture.md
    - docs/agents/data-runtime-implementation-plan.md
  exclude:
    - .git/**
    - .docpact/runs/**
    - node_modules/**
    - dist/**
    - coverage/**

freshness:
  warn_after_commits: 50
  warn_after_days: 90
  critical_after_days: 180

rules:
  - id: cli-bootstrap-contract
    scope: repo
    repo: cli
    triggers:
      - path: AGENTS.md
        kind: agent-contract
      - path: .docpact/config.yaml
        kind: governance-config
      - path: docs/agents/**
        kind: governed-doc
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
      - path: docs/agents/repo-architecture.md
        mode: review_or_update
    reason: Repo entry guidance, routing, architecture, and validation docs must stay aligned.
  - id: cli-command-surface-contract
    scope: repo
    repo: cli
    triggers:
      - path: bin/**
        kind: launcher
      - path: src/**
        kind: command-runtime
      - path: README.md
        kind: repo-readme
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: README.md
        mode: review_or_update
      - path: docs/agents/repo-architecture.md
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
    reason: Launcher and command runtime changes alter the public CLI contract.
  - id: cli-validation-contract
    scope: repo
    repo: cli
    triggers:
      - path: package.json
        kind: runtime-config
      - path: package-lock.json
        kind: dependency-lock
      - path: .dockerignore
        kind: clean-container-context-policy
      - path: Dockerfile.clean-test
        kind: clean-container-image
      - path: .nvmrc
        kind: node-baseline
      - path: .gitattributes
        kind: checkout-format-config
      - path: .prettierrc.json
        kind: formatter-config
      - path: tsconfig*.json
        kind: runtime-config
      - path: test/**
        kind: test
      - path: scripts/**
        kind: validation-script
      - path: .github/workflows/**
        kind: ci
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
    reason: Node baseline, quality gates, coverage, and CI define how CLI changes are validated.
  - id: cli-data-runtime-contract
    scope: repo
    repo: cli
    triggers:
      - path: docs/agents/data-runtime-architecture.md
        kind: proposed-data-architecture
      - path: docs/agents/data-runtime-implementation-plan.md
        kind: proposed-data-runbook
      - path: src/data/**
        kind: atomic-data-runtime
      - path: src/research/workspace/data-evidence-adapter.ts
        kind: research-data-adapter
      - path: test/data-*.test.ts
        kind: atomic-data-contract-test
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: docs/agents/repo-architecture.md
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
      - path: docs/agents/data-runtime-architecture.md
        mode: review_or_update
      - path: docs/agents/data-runtime-implementation-plan.md
        mode: review_or_update
    reason: Atomic data commands, contracts, connectors, and Research adaptation must preserve one CLI-owned machine boundary.

  - id: cli-issue-reporting
    scope: repo
    repo: cli
    triggers:
      - path: CONTRIBUTING.md
        kind: contributor-guide
      - path: .github/ISSUE_TEMPLATE/**
        kind: user-feedback-form
      - path: test/issue-reporting.test.ts
        kind: feedback-contract-test
    requiredDocs:
      - path: CONTRIBUTING.md
        mode: review_or_update
      - path: README.md
        mode: review_or_update
      - path: docs/agents/repo-architecture.md
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
    reason: Issue forms, CLI help, and packaged reporting guidance must implement the shared intake contract.
